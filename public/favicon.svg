<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- App-dark background with rounded corners -->
  <rect width="64" height="64" rx="13" fill="#04090c"/>

  <!-- Radial glow behind the tube (gives depth on dark tab bars) -->
  <radialGradient id="bg-glow" cx="32" cy="42" r="26" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#7effc4" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#7effc4" stop-opacity="0"/>
  </radialGradient>
  <rect width="64" height="64" rx="13" fill="url(#bg-glow)"/>

  <!-- ── Tube interior (dark base so spheres pop) ── -->
  <path d="M25.5 12 L25.5 44 Q25.5 56 32 56 Q38.5 56 38.5 44 L38.5 12 Z"
        fill="#081812"/>

  <!-- Teal liquid fill in lower portion -->
  <clipPath id="tube-clip">
    <path d="M25.5 12 L25.5 44 Q25.5 56 32 56 Q38.5 56 38.5 44 L38.5 12 Z"/>
  </clipPath>
  <rect x="25.5" y="36" width="13" height="22" fill="#7effc4" fill-opacity="0.20"
        clip-path="url(#tube-clip)"/>

  <!-- Liquid surface line -->
  <line x1="26.5" y1="35.5" x2="37.5" y2="35.5"
        stroke="#7effc4" stroke-width="1.1" stroke-opacity="0.40" stroke-linecap="round"/>

  <!-- ── Sample spheres inside liquid ── -->

  <!-- Cleared patient — left teal sphere -->
  <circle cx="28" cy="41.5" r="3.4" fill="#7effc4" fill-opacity="0.90"/>
  <!-- inner highlight on teal sphere -->
  <circle cx="27" cy="40.5" r="1.2" fill="white" fill-opacity="0.20"/>

  <!-- Cleared patient — right teal sphere -->
  <circle cx="36" cy="41.5" r="3.4" fill="#7effc4" fill-opacity="0.90"/>
  <circle cx="35" cy="40.5" r="1.2" fill="white" fill-opacity="0.20"/>

  <!-- Infected patient — red sphere (centered, bottom) with glow -->
  <circle cx="32" cy="50.5" r="7.5" fill="#ff4b4b" fill-opacity="0.18"/>
  <circle cx="32" cy="50.5" r="4.8" fill="#ff4b4b"/>
  <circle cx="30.8" cy="49.2" r="1.6" fill="white" fill-opacity="0.22"/>

  <!-- ── Test tube outline (mint green) ── -->
  <path d="M25.5 11 L25.5 44 Q25.5 56.5 32 56.5 Q38.5 56.5 38.5 44 L38.5 11"
        stroke="#7effc4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top cap / rim (solid filled rectangle) -->
  <rect x="21.5" y="6.5" width="21" height="5.5" rx="2.75" fill="#7effc4"/>

  <!-- Glass reflection — subtle left-edge glint -->
  <path d="M28.2 15 L28.2 33" stroke="white" stroke-width="1.3"
        stroke-linecap="round" stroke-opacity="0.16"/>

  <!-- Graduation marks (lab vial detail — just the left side ticks) -->
  <line x1="26.2" y1="22" x2="29.5" y2="22"
        stroke="#7effc4" stroke-width="1.0" stroke-opacity="0.38" stroke-linecap="round"/>
  <line x1="26.2" y1="28" x2="30.5" y2="28"
        stroke="#7effc4" stroke-width="1.0" stroke-opacity="0.28" stroke-linecap="round"/>
</svg>
